name: Build and Test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: Ubuntu
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows (MinGW)
            toolchain: mingw
            triplet: x64-mingw-dynamic
          - os: windows-latest
            name: Windows (MSVC)
            toolchain: msvc
            triplet: x64-windows
          # MSVC is the only toolchain here that builds native arm64: the
          # MinGW distributed by chocolatey is x86_64, so it would target x64
          # under emulation and duplicate the job above.
          - os: windows-11-arm
            name: Windows ARM (MSVC)
            toolchain: msvc
            triplet: arm64-windows
      fail-fast: false
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            build-essential \
            libeigen3-dev \
            catch2

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install eigen catch2

      - name: Install dependencies (Windows MinGW)
        if: runner.os == 'Windows' && matrix.toolchain == 'mingw'
        run: |
          choco install mingw
          vcpkg install eigen3 catch2 --triplet ${{ matrix.triplet }}

      - name: Install dependencies (Windows MSVC)
        if: runner.os == 'Windows' && matrix.toolchain == 'msvc'
        run: |
          vcpkg install eigen3 catch2 --triplet ${{ matrix.triplet }}

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2.2

      - name: Configure CMake (Windows MinGW)
        if: runner.os == 'Windows' && matrix.toolchain == 'mingw'
        run: cmake -B build -S . -DBUILD_TESTING=ON -G "MinGW Makefiles" -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Configure CMake (Windows MSVC)
        if: runner.os == 'Windows' && matrix.toolchain == 'msvc'
        run: cmake -B build -S . -DBUILD_TESTING=ON -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -B build -S . -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build ${{ runner.os == 'Windows' && matrix.toolchain == 'msvc' && '--config RelWithDebInfo' || '' }}

      - name: Install
        run: ${{ runner.os == 'Windows' && matrix.toolchain == 'msvc' && 'cmake --install build --config RelWithDebInfo' || runner.os == 'Windows' && 'cmake --install build' || 'sudo cmake --install build' }}

      - name: Test
        run: ctest --test-dir build --output-on-failure ${{ runner.os == 'Windows' && matrix.toolchain == 'msvc' && '-C RelWithDebInfo' || '' }}

  julia-bindings:
    name: Julia bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            build-essential \
            libeigen3-dev

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2.2

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1"

      - name: Instantiate Julia dependencies
        run: julia --project=bindings/julia --startup-file=no -e 'using Pkg; Pkg.instantiate()'

      - name: Configure Julia bindings
        run: |
          jlcxx_prefix="$(
            julia \
              --project=bindings/julia \
              --startup-file=no \
              -e 'using CxxWrap; print(CxxWrap.prefix_path())'
          )"
          cmake \
            -B build/julia \
            -S . \
            -DBUILD_JULIA_BINDINGS=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$jlcxx_prefix"

      - name: Build Julia bindings
        run: cmake --build build/julia --target slopejll --parallel 8

      - name: Smoke-test Julia module
        run: julia --project=bindings/julia --startup-file=no bindings/julia/smoke_test.jl build/julia/lib/libslopejll

  versionary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, julia-bindings]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN }}

      - id: versionary
        uses: jolars/versionary@v1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
