version: "3"

vars:
  BUILD_DIR: build
  BENCHMARK_BUILD_DIR: build/benchmark
  TEST_DIR: test
  JOBS: 8

tasks:
  default:
    deps: [configure, build]

  debug-on:
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -DCMAKE_BUILD_TYPE=Debug -DDAP_DEBUG=ON

  debug-off:
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -DCMAKE_BUILD_TYPE=Debug -DDAP_DEBUG=OFF

  configure:
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -DBUILD_DOCS=OFF -DENABLE_COVERAGE=OFF -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug

  build:
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} --parallel {{.JOBS}}

  docs:
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -DBUILD_DOCS=ON -DBUILD_TESTING=OFF -DENABLE_COVERAGE=OFF
      - cmake --build {{.BUILD_DIR}}

  coverage:
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -DBUILD_DOCS=ON -DBUILD_TESTING=ON -DENABLE_COVERAGE=ON
      - cmake --build {{.BUILD_DIR}}
      - ctest --test-dir {{.BUILD_DIR}} --output-on-failure

  release:
    deps: [clean]
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_DOCS=ON -DENABLE_COVERAGE=OFF
      - task: build

  clean:
    cmds:
      - rm -rf {{.BUILD_DIR}}/*

  install:
    cmds:
      - cmake --install {{.BUILD_DIR}}

  test:
    deps: [build]
    cmds:
      - ctest --test-dir {{.BUILD_DIR}} --output-on-failure

  benchmark:
    deps: [build]
    cmds:
      - ./build/tests [!benchmark] --benchmark-samples 20

  linpred-benchmark:
    deps: [build]
    cmds:
      - ./build/tests "Linear predictor parallelization" --benchmark-samples 10

  gradient-benchmark:
    deps: [build]
    cmds:
      - ./build/tests "Parallelized gradient computations" --benchmark-samples 10

  full-set-benchmark:
    cmds:
      - cmake -B {{.BENCHMARK_BUILD_DIR}} -S . -DBUILD_DOCS=OFF -DENABLE_COVERAGE=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - cmake --build {{.BENCHMARK_BUILD_DIR}} --parallel {{.JOBS}}
      - ./{{.BENCHMARK_BUILD_DIR}}/tests "[full_set]" --benchmark-samples 20

  high-dimensional-benchmark-build:
    cmds:
      - cmake -B {{.BENCHMARK_BUILD_DIR}} -S . -DBUILD_DOCS=OFF -DENABLE_COVERAGE=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - cmake --build {{.BENCHMARK_BUILD_DIR}} --target tests --parallel {{.JOBS}}

  high-dimensional-benchmark-data:
    cmds:
      - mkdir -p .cache/benchmarks
      - test -f .cache/benchmarks/rcv1_train.binary.bz2 || curl --fail --location https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/binary/rcv1_train.binary.bz2 --output .cache/benchmarks/rcv1_train.binary.bz2
      - test -f .cache/benchmarks/rcv1_train.binary || bzip2 --decompress --keep .cache/benchmarks/rcv1_train.binary.bz2
      - test -f .cache/benchmarks/E2006.train.bz2 || curl --fail --location https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/regression/E2006.train.bz2 --output .cache/benchmarks/E2006.train.bz2
      - test -f .cache/benchmarks/E2006.train || bzip2 --decompress --keep .cache/benchmarks/E2006.train.bz2

  high-dimensional-benchmark:
    deps: [high-dimensional-benchmark-build, high-dimensional-benchmark-data]
    cmds:
      - SLOPE_BENCHMARK_DATASET=rcv1 SLOPE_BENCHMARK_DATA_PATH=.cache/benchmarks/rcv1_train.binary ./{{.BENCHMARK_BUILD_DIR}}/tests "High-dimensional solver paths" --benchmark-samples 3
      - SLOPE_BENCHMARK_DATASET=e2006 SLOPE_BENCHMARK_DATA_PATH=.cache/benchmarks/E2006.train ./{{.BENCHMARK_BUILD_DIR}}/tests "High-dimensional solver paths" --benchmark-samples 3
